# AR Trip — entrada pública (porta `PORTA` no host).
# Proxy único: /api e /uploads vão pro backend, todo o resto pro site (Next.js).
# Assim o navegador do Anderson enxerga tudo numa origem só — sem CORS e sem
# precisar de URL pública pro backend (mesmo padrão do painel do TINTA.AI).
server {
    listen 80;
    server_name _;

    client_max_body_size 40m;

    location /api/ {
        proxy_pass http://backend:3333;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://backend:3333;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}