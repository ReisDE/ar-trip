# docker-compose.yml — AR Trip
# Mesmo formato de deploy do TINTA.AI: PostgreSQL + backend + site num só
# servidor (aqui: sua própria máquina). O nginx expõe uma porta única
# (`PORTA`, default 8093) — pra divulgar, roda um cloudflared quick tunnel
# nela e manda o link pro Anderson.
#
# Subir:   cp .env.docker.example .env && docker compose up -d --build
# Ver:     docker compose logs -f web

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ar_trip
      POSTGRES_USER: artrip
      POSTGRES_PASSWORD: ${POSTGRES_SENHA:?defina POSTGRES_SENHA no .env}
    volumes:
      - dados_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U artrip -d ar_trip"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - artrip-internal

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://artrip:${POSTGRES_SENHA}@db:5432/ar_trip?schema=public
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env}
      PORT: "3333"
      EVOLUTION_API_URL: ${EVOLUTION_API_URL:-http://evolution:8080}
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY:-}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      MERCADOPAGO_ACCESS_TOKEN: ${MERCADOPAGO_ACCESS_TOKEN:-}
      MERCADOPAGO_WEBHOOK_SECRET: ${MERCADOPAGO_WEBHOOK_SECRET:-}
      CLAUDE_API_KEY: ${CLAUDE_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - uploads:/app/uploads
    command: ["sh", "-c", "npx prisma migrate deploy && npx ts-node prisma/seed.ts && node dist/src/main.js"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3333/api/pacotes').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - artrip-internal
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: /api
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - artrip-internal
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  web:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    ports:
      - "${PORTA:-8093}:80"
    volumes:
      - ./nginx/artrip.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - artrip-internal
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

networks:
  artrip-internal:
    driver: bridge

volumes:
  dados_pg:
  uploads: